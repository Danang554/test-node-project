services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-node-api
    ports:
      - "5000:5000"
    environment:
      - APP_NAME=test-node-project
      - APP_HOST=0.0.0.0
      - APP_PORT=5000
      - APP_ENV=production
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=test_node_project
      - JWT_SECRET=super-secret-jwt-key-replace-this-in-production
      - JWT_EXPIRES_IN=24h
      - LOG_DIR=storage/logs
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage/logs:/app/storage/logs
    restart: unless-stopped
    networks:
      - default
      - test-project-network

networks:
  test-project-network:
    name: test-project-network
    external: true
